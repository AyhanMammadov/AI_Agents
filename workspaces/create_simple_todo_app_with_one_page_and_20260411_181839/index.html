<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TODO</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 24px; }
    h1 { margin-top: 0; font-size: 1.6em; text-align: center; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
    input[type="text"].error { border-color: #e74c3c; background: #fff6f6; }
    button { padding: 8px 16px; border: none; background: #3498db; color: #fff; border-radius: 4px; font-size: 1em; cursor: pointer; }
    button:disabled { background: #b3d6f5; cursor: not-allowed; }
    .tasks { list-style: none; padding: 0; margin: 0; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .task-text { flex: 1; }
    .delete-btn { background: #e74c3c; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 0.95em; margin-left: 12px; }
    .delete-btn:hover { background: #c0392b; }
    .empty { color: #888; text-align: center; margin: 24px 0; }
    .validation-msg { color: #e74c3c; font-size: 0.95em; margin-top: 4px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Список задач</h1>
    <form id="todo-form" autocomplete="off">
      <input type="text" id="task-input" placeholder="Введите задачу" />
      <button type="submit">Добавить</button>
    </form>
    <div id="validation" class="validation-msg" style="display:none"></div>
    <ul id="tasks" class="tasks"></ul>
    <div id="empty" class="empty" style="display:none">Нет задач</div>
  </div>
  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('task-input');
    const tasksList = document.getElementById('tasks');
    const validationMsg = document.getElementById('validation');
    const emptyState = document.getElementById('empty');
    let tasks = [];

    function renderTasks() {
      tasksList.innerHTML = '';
      if (tasks.length === 0) {
        emptyState.style.display = '';
      } else {
        emptyState.style.display = 'none';
        tasks.forEach((task, idx) => {
          const li = document.createElement('li');
          li.className = 'task-item';
          const span = document.createElement('span');
          span.className = 'task-text';
          span.textContent = task;
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = 'Удалить';
          delBtn.onclick = function() {
            tasks.splice(idx, 1);
            renderTasks();
          };
          li.appendChild(span);
          li.appendChild(delBtn);
          tasksList.appendChild(li);
        });
      }
    }

    function showValidation(msg) {
      validationMsg.textContent = msg;
      validationMsg.style.display = '';
      input.classList.add('error');
    }

    function clearValidation() {
      validationMsg.textContent = '';
      validationMsg.style.display = 'none';
      input.classList.remove('error');
    }

    form.onsubmit = function(e) {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) {
        showValidation('Введите текст задачи');
        input.focus();
        return;
      }
      clearValidation();
      tasks.push(value);
      renderTasks();
      input.value = '';
      input.focus();
    };

    input.oninput = function() {
      if (input.classList.contains('error')) {
        clearValidation();
      }
    };

    renderTasks();
    input.focus();
  </script>
</body>
</html>
